name: Release

# Pushing a v* tag hands the build to CupOfBread/magpie-lite-releases, which
# builds the files and publishes them there. Nothing is copied back here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0 — no v prefix; the v tag must exist)'
        required: true
        type: string

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}

    steps:
      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          else
            VERSION="$INPUT_VERSION"
            REF="v$INPUT_VERSION"
          fi
          # a newline or quote would add outputs or break the JSON below
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Triggering release for version: $VERSION (ref: $REF)"

      - name: Trigger release workflow in magpie-lite-releases
        uses: peter-evans/repository-dispatch@v3
        with:
          # PAT with contents write on CupOfBread/magpie-lite-releases.
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          repository: CupOfBread/magpie-lite-releases
          event-type: release
          client-payload: '{"ref": "${{ steps.version.outputs.ref }}", "version": "${{ steps.version.outputs.version }}"}'

      - name: Output status
        run: echo "Watch the build at https://github.com/CupOfBread/magpie-lite-releases/actions"
